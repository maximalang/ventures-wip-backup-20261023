autoroute:
  # Bench-first lane catalog (evidence: bench-nous-20261015,
  # profiles/company/cache/scratch/bench-nous-20261015/results.json; scores 0-5).
  # Router: agent/autoroute.py; frontdoors: `hermes autoroute`, `hermes chat --provider autoroute`.
  default_lane: zai-glm53
  lanes:
    - name: zai-glm53
      provider: zai
      model: glm-5.3
      cost_tier: subscription
      evidence: bench-nous-20261015 5.75/6, 0 flakes, fastest
      classes: {code: 4.5, reasoning: 4.5, routine: 5.0, long_context: 4.0}
    - name: nous-laguna-free
      provider: nous
      model: poolside/laguna-s-2.1:free
      cost_tier: free
      max_tokens_floor: 6000
      evidence: bench-nous-20261015 (capable at budget>=6000; empties at <=1600 are proven budget exhaustion, not transient)
      classes: {code: 4.0, routine: 3.5}
    - name: nous-step5-free
      provider: nous
      model: stepfun/step-5-preview:free
      cost_tier: free
      max_tokens_floor: 6000
      evidence: bench-nous-20261015 + StepFun leaderboard coverage (knowledge/finance/agent, 1M ctx)
      classes: {reasoning: 4.25, long_context: 4.0}
    - name: codex-sol
      provider: openai-codex
      model: gpt-6.1-sol
      cost_tier: subscription
      require_explicit: true
      evidence: fleet doctrine Rev4 tier-2 quality ceiling; quota-guarded, pin explicitly only
      classes: {code: 5.0, reasoning: 5.0}

